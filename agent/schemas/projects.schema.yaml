# Schema for ~/.acp/projects.yaml
schema:
  required:
    - registry_version
    - last_updated
  
  fields:
    current_project:
      type: string
      description: Name of currently active project
      required: false
    
    registry_version:
      type: string
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      description: Schema version (semver)
      required: true
    
    last_updated:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      description: Last registry update timestamp (ISO 8601)
      required: true
    
    projects:
      type: object
      description: Map of project names to project metadata
      required: false
      schema:
        fields:
          path:
            type: string
            description: Absolute path to project directory
            required: true
          
          type:
            type: string
            description: Project type (mcp-server, web-app, cli-tool, etc.)
            required: true
          
          description:
            type: string
            description: One-line project description
            required: true
          
          created:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
            description: Project creation timestamp
            required: true
          
          last_modified:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
            description: Last modification timestamp
            required: true
          
          last_accessed:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
            description: Last access timestamp (updated by @acp.project-set)
            required: true
          
          status:
            type: enum
            values: [active, archived, paused]
            description: Project status
            required: true
          
          tags:
            type: array
            description: Searchable tags
            required: false
          
          related_projects:
            type: array
            description: Names of related projects
            required: false
          
          dependencies:
            type: object
            description: External dependencies by package manager
            required: false
